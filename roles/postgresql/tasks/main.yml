---
- name: Instalar PostgreSQL y la libreria de conexion de PHP
  community.general.zypper:
    name: "{{ pg_packages + [pg_php_package] }}"
    state: present
  notify: Reiniciar apache

- name: PostgreSQL activo y habilitado (en openSUSE el primer arranque crea la base de datos inicial)
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: Generar certificado SSL autofirmado (solo si no existe)
  ansible.builtin.command: >
    openssl req -new -x509 -days {{ pg_ssl_days }} -nodes
    -subj "/CN={{ ansible_facts['hostname'] }}"
    -out server.crt -keyout server.key
  args:
    chdir: "{{ pg_data_dir }}"
    creates: "{{ pg_data_dir }}/server.crt"
  notify: Reiniciar postgresql

- name: Permisos del certificado y la clave
  ansible.builtin.file:
    path: "{{ pg_data_dir }}/{{ item.archivo }}"
    owner: postgres
    group: postgres
    mode: "{{ item.modo }}"
  loop:
    - { archivo: server.crt, modo: "0644" }
    - { archivo: server.key, modo: "0600" }

- name: Carpeta para configuracion adicional
  ansible.builtin.file:
    path: "{{ pg_data_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Copiar configuracion remota y SSL (plantilla)
  ansible.builtin.template:
    src: aso.conf.j2
    dest: "{{ pg_data_dir }}/conf.d/aso.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reiniciar postgresql

- name: Incluir la carpeta conf.d en postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_data_dir }}/postgresql.conf"
    regexp: "^#?include_dir"
    line: "include_dir = 'conf.d'"
  notify: Reiniciar postgresql

- name: Copiar reglas de acceso pg_hba.conf (plantilla)
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
    backup: true
  notify: Reiniciar postgresql

- name: Aplicar la configuracion antes de crear usuarios
  ansible.builtin.meta: flush_handlers

- name: Contrasena de postgres, usuario nuevo y base de datos
  ansible.builtin.command: psql -v ON_ERROR_STOP=1
  become_user: postgres
  args:
    stdin: |
      ALTER USER postgres WITH PASSWORD '{{ pg_postgres_password }}';
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ pg_user }}') THEN
          CREATE ROLE {{ pg_user }} LOGIN;
        END IF;
      END
      $$;
      ALTER ROLE {{ pg_user }} WITH LOGIN PASSWORD '{{ pg_password }}';
      SELECT 'CREATE DATABASE {{ pg_db }} OWNER {{ pg_user }}'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ pg_db }}')\gexec
  changed_when: false
  no_log: true

- name: Comprobar que la base existe
  ansible.builtin.command: psql -tAc "SELECT datname FROM pg_database WHERE datname = '{{ pg_db }}'"
  become_user: postgres
  register: pg_check
  changed_when: false
  failed_when: pg_db not in pg_check.stdout

- name: Abrir PostgreSQL en el firewall
  ansible.posix.firewalld:
    service: postgresql
    permanent: true
    immediate: true
    state: enabled
