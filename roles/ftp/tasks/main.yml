- name: Instalar vsftpd
  community.general.zypper:
    name: vsftpd
    state: present
- name: Copiar configuracion FTP a VM02
  ansible.builtin.copy:
    src: vsftpd.conf
    dest: /etc/vsftpd.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Reiniciar FTP
- name: Iniciar y habilitar FTP
  ansible.builtin.systemd:
    name: vsftpd
    state: started
    enabled: true
- name: Permitir FTP en el firewall
  ansible.posix.firewalld:
    service: ftp
    permanent: true
    immediate: true
    state: enabled
- name: Abrir puertos FTP pasivos
  ansible.posix.firewalld:
    port: 40000-40010/tcp
    permanent: true
    immediate: true
    state: enabled
