---
- name: Instalar MariaDB
  ansible.builtin.package:
    name: mariadb
    state: present

- name: Activar MariaDB
  ansible.builtin.systemd:
    name: mariadb
    state: started
    enabled: true

- name: Comprobar base de datos
  ansible.builtin.command:
    cmd: mariadb -N -e "SELECT SCHEMA_NAME FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME='practica_ansible';"
  register: resultado_bd
  changed_when: false

- name: Crear base de datos si no existe
  ansible.builtin.command:
    cmd: mariadb -e "CREATE DATABASE IF NOT EXISTS practica_ansible;"
  when: resultado_bd.stdout | trim == ""
