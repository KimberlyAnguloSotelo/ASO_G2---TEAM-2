---
- name: Instalar servicios web en openSUSE Leap 16.0
  hosts: servidor
  become: true

  tasks:
    - name: Instalar Apache, PHP y MariaDB
      community.general.zypper:
        name:
          - apache2
          - php8
          - apache2-mod_php8
          - php8-mysql
          - mariadb
        state: present

    - name: Iniciar y habilitar Apache
      ansible.builtin.systemd:
        name: apache2
        state: started
        enabled: true

    - name: Iniciar y habilitar MariaDB
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: true

    - name: Permitir HTTP en el firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled
